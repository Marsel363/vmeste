services:
  - type: web
    name: vmeste
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: ALLOW_CREATE_COUPLE
        value: "0"
      - key: ENABLE_SCHEDULER
        value: "1"
      - key: SYNC_INTERVAL_HOURS
        value: "24"
      - key: MGSU_SOURCE
        value: auto
      - key: FORWARDED_ALLOW_IPS
        value: "*"
